name: deploy-pages

# Site 100% tĩnh → deploy thư mục out/ lên GitHub Pages sau mỗi push lên main.
# URL: https://kannot111.github.io/webdemo/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cài dependencies
        run: npm ci

      - name: Build static export (basePath /webdemo)
        run: npm run build:static
        env:
          BASE_PATH: /webdemo

      - name: Tắt Jekyll (giữ nguyên thư mục _next)
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
